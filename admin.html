<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAZO Admin</title>
<style>
:root{--bg:#0b0e17;--c:#141a2a;--c2:#1c2438;--t:#e8ecf7;--m:#8a94b0;--g:#22d39a;--r:#ff5d7a;--a:#7c5cff}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(800px 400px at 85% -5%,#3a2a9a55,transparent),var(--bg);color:var(--t);font:14px system-ui,sans-serif;min-height:100vh}
.w{max-width:720px;margin:auto;padding:14px}
.card{background:linear-gradient(160deg,var(--c),var(--c2));border:1px solid #ffffff10;border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.m{color:var(--m);font-size:12px}.g{color:var(--g)}.r{color:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.grid .card{margin:0}
.grid b{display:block;font-size:17px;margin:4px 0 2px}
button{font:inherit;color:inherit}
.btn{width:100%;border:0;border-radius:12px;padding:12px;font-weight:700;background:linear-gradient(90deg,var(--a),#a78bfa);cursor:pointer}
.btn.b{background:linear-gradient(90deg,#14b88a,var(--g));color:#04251b}.btn.s{background:linear-gradient(90deg,#e8415f,var(--r))}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:6px;background:#0d1322;padding:4px;border-radius:12px;margin:12px 0}
.tabs button{flex:1;border:0;background:0;padding:10px;border-radius:9px;color:var(--m);font-weight:600;cursor:pointer}
.tabs .on{background:var(--c2);color:var(--t)}
.bd{font-size:11px;padding:2px 8px;border-radius:9px;background:#ffffff14}
.pending{color:#ffc857}.approved{color:var(--g)}.rejected,.hangus{color:var(--r)}
.li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #ffffff0d}
.ov{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;padding:24px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;z-index:20;display:none;font-weight:600}
.hide{display:none!important}
</style></head><body>
<div id="lg" class="ov hide"><h1>CAZO Admin</h1><p class="m">Khusus admin terdaftar</p><button class="btn" id="gb" style="max-width:280px">Masuk dengan Google</button></div>
<div id="toast"></div>
<div class="w hide" id="app">
<div class="row"><h2>CAZO Admin</h2><button id="out" class="bd" style="border:0;cursor:pointer">Keluar</button></div>
<div class="grid" id="st" style="margin-top:12px"></div>
<div class="tabs" id="tb"><button data-t="dep" class="on">Deposit</button><button data-t="wd">Withdraw</button><button data-t="us">User</button></div>
<div id="list"></div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getDatabase,ref,onValue,runTransaction}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",authDomain:"mybro-9ba5f.firebaseapp.com",databaseURL:"https://mybro-9ba5f-default-rtdb.firebaseio.com/",projectId:"mybro-9ba5f"});
const db=getDatabase(app),au=getAuth(app),R=p=>ref(db,p);
const ADMINS=["GANTI_EMAIL_ADMIN@gmail.com"];   // <- isi email Google admin
const MIN_DEP=5e3;
const $=i=>document.getElementById(i),f=(n,d=0)=>(+n).toLocaleString('id-ID',{maximumFractionDigits:d}),rp=n=>'Rp '+f(n);
const dt=t=>new Date(t).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'});
const e=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const toast=t=>{const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(x.t);x.t=setTimeout(()=>x.style.display='none',2800)};
let me,Q=[],UU=[],tab='dep';
$('tb').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;[...$('tb').children].forEach(x=>x.classList.toggle('on',x==b));tab=b.dataset.t;view()};
$('gb').onclick=()=>signInWithPopup(au,new GoogleAuthProvider()).catch(x=>toast(x.message));
$('out').onclick=()=>signOut(au).then(()=>location.reload());

function view(){
 const pd=Q.filter(r=>r.type=='dep'&&r.status=='pending'),pw=Q.filter(r=>r.type=='wd'&&r.status=='pending'),sum=a=>a.reduce((s,r)=>s+r.amount,0);
 $('st').innerHTML=`<div class="card"><span class="m">Deposit pending</span><b>${pd.length}</b><span class="m">${rp(sum(pd))}</span></div><div class="card"><span class="m">Withdraw pending</span><b>${pw.length}</b><span class="m">${rp(sum(pw))}</span></div><div class="card"><span class="m">User</span><b>${UU.length}</b><span class="m">Saldo: ${rp(UU.reduce((s,[,u])=>s+(u.idr||0),0))}</span></div>`;
 if(tab=='us')return void($('list').innerHTML=`<div class="card">${UU.map(([,u])=>`<div class="li"><div>${e(u.name)}<br><span class="m">${e(u.email)}</span></div><div style="text-align:right">${rp(u.idr||0)}<br><span class="m">${f(u.cazo||0,4)} CAZO</span></div></div>`).join('')||'<p class="m">Belum ada user</p>'}</div>`);
 const a=Q.filter(r=>r.type==tab).sort((x,y)=>(y.status=='pending')-(x.status=='pending')||y.ts-x.ts).slice(0,80);
 $('list').innerHTML=a.map(r=>`<div class="card" style="${r.status=='pending'?'':'opacity:.6'}"><div class="row"><b>${e(r.name)}</b><span class="bd ${e(r.status)}">${e(r.status)}</span></div><div class="m">${e(r.email)} · ${dt(r.ts)}</div><h3 style="margin:6px 0">${rp(r.amount)}</h3><div class="m">${e(r.note)}</div>${r.status=='pending'?`<div class="row" style="margin-top:10px"><button class="btn b" data-a="1" data-u="${e(r.u)}" data-i="${e(r.i)}">Setujui</button><button class="btn s" data-a="0" data-u="${e(r.u)}" data-i="${e(r.i)}">Tolak</button></div>`:''}</div>`).join('')||'<p class="m">Belum ada pengajuan</p>';
}
$('list').onclick=async ev=>{const b=ev.target.closest('button[data-u]');if(!b)return;b.disabled=true;
 const u=b.dataset.u,ok=b.dataset.a=='1';let r;
 try{await runTransaction(R(`reqs/${u}/${b.dataset.i}`),x=>{if(!x||x.status!='pending'||(x.type=='dep'&&ok&&x.amount<MIN_DEP))return;r={...x};x.status=ok?'approved':'rejected';x.by=me.email;x.at=Date.now();return x});
 if(!r)return toast('Sudah diproses / tidak valid');
 if((r.type=='dep'&&ok)||(r.type=='wd'&&!ok))await runTransaction(R('users/'+u),x=>{if(!x)return;x.idr=(x.idr||0)+r.amount;return x});
 toast(ok?'Disetujui':'Ditolak'+(r.type=='wd'?' · saldo dikembalikan':''))}
 catch(x){toast(x.message)}finally{b.disabled=false}};

onAuthStateChanged(au,u=>{
 if(!u)return $('lg').classList.remove('hide');
 if(!ADMINS.includes(u.email)){toast('Akun ini bukan admin');return void signOut(au)}
 me=u;$('lg').classList.add('hide');$('app').classList.remove('hide');
 onValue(R('reqs'),s=>{Q=[];const v=s.val()||{};for(const a in v)for(const i in v[a])Q.push({u:a,i,...v[a][i]});view()});
 onValue(R('users'),s=>{UU=Object.entries(s.val()||{});view()});
});
</script></body></html>
